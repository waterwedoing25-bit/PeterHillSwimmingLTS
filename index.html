<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peter Hill Swimming</title>

<!-- ===== This page is the one that actually controls the tab favicon ===== -->
<!-- ===== and the Add to Home Screen icon, since it's a real top-level  ===== -->
<!-- ===== page (unlike Index.html, which Apps Script serves inside an  ===== -->
<!-- ===== iframe it wraps with its own page).                          ===== -->
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1dp5d8laT4CGShz-z69Q5y3dDYsfbORJA">
<link rel="shortcut icon" type="image/png" href="https://lh3.googleusercontent.com/d/1dp5d8laT4CGShz-z69Q5y3dDYsfbORJA">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1dp5d8laT4CGShz-z69Q5y3dDYsfbORJA">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2a45">

<!-- iOS-specific "add to home screen" hints -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PHS Tracker">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f2a45 0%, #081a2b 100%);
    color: #ffffff;
    text-align: center;
    padding: 20px;
  }
  img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
  }
  h1 {
    font-size: 1.1em;
    margin: 0;
    font-weight: 700;
  }
  p {
    margin: 0;
    font-size: 0.85em;
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
  <img src="https://lh3.googleusercontent.com/d/1dp5d8laT4CGShz-z69Q5y3dDYsfbORJA" alt="Peter Hill Swimming">
  <h1>Peter Hill Swimming</h1>
  <p id="statusText" style="max-width:280px; line-height:1.5;">
    <strong>First time here?</strong> Add this page to your Home Screen now
    (Share → Add to Home Screen), before it opens the app below — that's
    what makes the icon come out right.
  </p>
  <button id="openBtn" style="
    background: linear-gradient(135deg, #ff7a45, #e8622e);
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 30px;
    font-size: 0.95em;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 6px;
  ">Open App →</button>
  <p style="font-size:0.72em; color:rgba(255,255,255,0.5); margin-top:4px;" id="countdownText"></p>

  <script>
    // ⚠️ Replace this with your actual Apps Script web app URL
    // (the one ending in /exec from Deploy → Manage deployments)
    const APP_URL = 'https://script.google.com/macros/s/AKfycbxmA72wI6irZM6BnyIlzuXI4fvFmB2LsgBdmcyIg62gTqOh0hvAuQfFzvOu7nP65vwXxQ/exec';

    document.getElementById('openBtn').addEventListener('click', function () {
      window.location.href = APP_URL;
    });

    // Auto-forward after a delay — long enough that tapping Share → Add to
    // Home Screen right after the page loads still captures THIS page (and
    // its icon), not the app it redirects to. Once installed, opening the
    // saved icon will briefly show this screen before moving on, same as
    // clicking the button manually.
    let secondsLeft = 6;
    const countdownEl = document.getElementById('countdownText');
    const tick = () => {
      countdownEl.textContent = secondsLeft > 0
        ? 'Opening automatically in ' + secondsLeft + '...'
        : '';
      secondsLeft--;
    };
    tick();
    const timer = setInterval(function () {
      if (secondsLeft < 0) {
        clearInterval(timer);
        window.location.href = APP_URL;
        return;
      }
      tick();
    }, 1000);
  </script>
</body>
</html>
